name: build lkm4ctr for OPPO Find X7 (android14-6.1)

# 为 OPPO Find X7 (MT6989) 构建 lkm4ctr.ko, 并打包成 KernelSU 模块。
#
# 目的: 在**不刷内核**的前提下让 Droidspaces 跑起来。
#
# 设备情况 (6.1.157-android14-11-o-g2d576b643492, KMI android14-6.1):
#   缺  CONFIG_PID_NS / SYSVIPC / DEVTMPFS / USER_NS 等
#   有  CONFIG_KPROBES=y (lkm4ctr 的 kprobe 后端依赖)
#
# 实测结果 (2026-11-12, run 43175535973 的产物上机):
#   Droidspaces v7.2.0 check -> [MUST HAVE] 全部通过
#   仍未覆盖: DEVTMPFS / MACVLAN / IP6_NF_NAT / CFS_BANDWIDTH /
#             CGROUP_PIDS / USER_NS (均为 OPTIONAL 或 RECOMMENDED)
#
# 构建用 SukiSU-Ultra 的 DDK 容器, 内含该 KMI 真实的
# vmlinux + Module.symvers + 匹配的 clang 工具链。

on:
  workflow_dispatch:
    inputs:
      kmi:
        description: 'KMI'
        required: false
        type: string
        default: 'android14-6.1'
      ddk_release:
        description: 'DDK 镜像 release 标签'
        required: false
        type: string
        default: '20260828'
      upstream_ref:
        description: 'lkm4ctr 源码 ref'
        required: false
        type: string
        default: 'lkm4ctr'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build lkm4ctr.ko (${{ inputs.kmi }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
    timeout-minutes: 60

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v6

      - name: 拉取 lkm4ctr 源码
        run: |
          set -euxo pipefail
          apt-get update -qq || true
          apt-get install -y -qq git ca-certificates || true
          rm -rf /tmp/lkm4ctr
          # 上游默认分支名是 lkm4ctr (不是 main)。ref 不可用时回退到默认分支,
          # 避免因分支改名导致整条构建线断掉。
          if ! git clone --depth=1 --branch "${{ inputs.upstream_ref }}" \
                 https://github.com/cyanmint/lkm4ctr.git /tmp/lkm4ctr 2>/dev/null; then
            echo "::warning::ref '${{ inputs.upstream_ref }}' 拉取失败, 改用默认分支"
            rm -rf /tmp/lkm4ctr
            git clone --depth=1 https://github.com/cyanmint/lkm4ctr.git /tmp/lkm4ctr
          fi
          echo ">>> HEAD: $(git -C /tmp/lkm4ctr rev-parse --short HEAD 2>/dev/null || echo unknown)"

      - name: 确认 DDK 环境
        run: |
          set -euxo pipefail
          KDIR="/opt/ddk/kdir/${{ inputs.kmi }}"
          test -d "$KDIR" || { echo "::error::DDK 目录不存在: $KDIR"; ls /opt/ddk/kdir 2>/dev/null || true; exit 1; }
          echo ">>> KDIR=$KDIR"
          test -s "$KDIR/Module.symvers" && echo ">>> Module.symvers: $(wc -l < "$KDIR/Module.symvers") 条"

      - name: 编译 lkm4ctr.ko
        run: |
          set -euxo pipefail
          KDIR="/opt/ddk/kdir/${{ inputs.kmi }}"
          ROOT="/tmp/lkm4ctr/vendor"
          test -f "$ROOT/Makefile" || { echo "::error::vendor/Makefile 不存在"; ls "$ROOT"; exit 1; }
          make -C "$KDIR" M="$ROOT" LKM4CTR_LOG_DMESG=y modules -j"$(nproc)"
          mkdir -p "$GITHUB_WORKSPACE/out"
          find "$ROOT" -name '*.ko' -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: 编译额外模块 (macvlan / ip6nat / pids)
        continue-on-error: true
        run: |
          set -uxo pipefail
          KDIR="/opt/ddk/kdir/${{ inputs.kmi }}"
          mkdir -p "$GITHUB_WORKSPACE/out"

          # 这些模块来自 ai-luo2006/droidspaces-6.12-pmb110, 原本针对
          # android16-6.12。在 6.1 上大概率编不过, 但 continue-on-error
          # 让失败不影响主模块产物, 同时暴露真实错误用于后续适配。
          for m in net_macvlan_61 net_ip6nat devtmpfs net_macvlan; do
            SRC="$GITHUB_WORKSPACE/extra/$m"
            [ -f "$SRC/Makefile" ] || { echo "::warning::$m 无 Makefile, 跳过"; continue; }
            echo "=============================================="
            echo ">>> 编译 $m"
            echo "=============================================="
            if make -C "$KDIR" M="$SRC" modules -j"$(nproc)"; then
              find "$SRC" -maxdepth 1 -name '*.ko' -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;
              echo "    [OK] $m"
            else
              echo "    [FAIL] $m 编译失败 (预期内, 见上方错误)"
            fi
          done

          echo "=== 当前 out/ 内容 ==="
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: 校验 ko
        run: |
          set -euo pipefail
          KDIR="/opt/ddk/kdir/${{ inputs.kmi }}"
          for f in "$GITHUB_WORKSPACE"/out/*.ko; do
            [ -f "$f" ] || continue
            echo "=== $(basename "$f") ==="
            VM=$(modinfo -F vermagic "$f" 2>/dev/null || strings "$f" | grep -m1 'vermagic=' | sed 's/vermagic=//')
            echo "  vermagic : $VM"
            echo "  大小     : $(du -h "$f" | cut -f1)"
            # struct module 尺寸决定 ABI 是否匹配: 设备上所有厂商 ko 都是 1088 (0x440)
            TM=$(readelf -SW "$f" 2>/dev/null | awk '/this_module/{print $6; exit}')
            if [ -n "$TM" ]; then
              echo "  this_module: 0x$TM = $((16#$TM)) 字节"
              [ "$((16#$TM))" -eq 1088 ] && echo "    OK 与设备 1088 一致" || echo "    ::warning::与设备 1088 不符"
            fi
            VS=$(readelf -SW "$f" 2>/dev/null | awk '/__versions/{print $6; exit}')
            [ -n "$VS" ] && echo "  __versions: $((16#$VS)) 字节"
          done

      - name: 打包 KernelSU 模块
        run: |
          set -euo pipefail
          # DDK 镜像精简, 不自带 zip
          command -v zip >/dev/null 2>&1 || {
            apt-get update -qq && apt-get install -y -qq zip unzip
          }

          STAGE="$GITHUB_WORKSPACE/ksu_module"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          # 收集 out/ 下全部 ko (主模块 + 额外模块)
          for k in "$GITHUB_WORKSPACE"/out/*.ko; do
            [ -f "$k" ] && cp -v "$k" "$STAGE/"
          done
          [ -n "$(ls -A "$STAGE"/*.ko 2>/dev/null)" ] || { echo "::error::没有任何 ko"; exit 1; }
          cp ksu/module.prop    "$STAGE/"
          cp ksu/service.sh     "$STAGE/"
          cp ksu/customize.sh   "$STAGE/"
          cp ksu/uninstall.sh   "$STAGE/"
          cp ksu/action.sh      "$STAGE/"
          chmod 755 "$STAGE"/*.sh

          # 脚本必须 LF 换行, 否则 Android 的 sh 会报 "No such file or directory"
          sed -i 's/\r$//' "$STAGE"/*.sh "$STAGE/module.prop"

          cd "$STAGE"
          ZIP="$GITHUB_WORKSPACE/lkm4ctr-oppo-$(date +%Y%m%d).zip"
          rm -f "$ZIP"
          zip -qr9 "$ZIP" .
          cd "$GITHUB_WORKSPACE"
          echo ">>> $ZIP ($(du -h "$ZIP" | cut -f1))"
          unzip -l "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: lkm4ctr-oppo-${{ inputs.kmi }}
          path: |
            out/*.ko
            lkm4ctr-oppo-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: lkm4ctr-oppo-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: |
          find dist -type f -exec ls -lh {} \;

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="build-$(date +%Y%m%d-%H%M%S)"
          {
            echo "### lkm4ctr + 额外模块 for OPPO Find X7"
            echo
            echo "KMI: \`${{ inputs.kmi }}\` / DDK: \`${{ inputs.ddk_release }}\`"
            echo
            echo "源码: [cyanmint/lkm4ctr](https://github.com/cyanmint/lkm4ctr)"
            echo
            echo "#### 包含的模块"
            echo
            echo "| 模块 | 作用 | 状态 |"
            echo "|---|---|---|"
            echo "| \`lkm4ctr.ko\` | PID / UTS / IPC namespace | 设备实测可用 |"
            echo "| \`ip6table_nat.ko\` | IPv6 NAT | 编译通过 |"
            echo "| \`macvlan.ko\` | 容器独立局域网 IP (6.1 原生源码) | 编译通过 |"
            echo
            echo "#### 设备实测（\`6.1.157-android14-11-o-g2d576b643492\`）"
            echo
            echo "\`\`\`"
            echo "Droidspaces v7.2.0 check:"
            echo "  [MUST HAVE] 全部通过"
            echo "    ✓ PID namespace       (lkm4ctr 补齐)"
            echo "    ✓ IPC namespace       (lkm4ctr 补齐)"
            echo "    ✓ UTS / Mount namespace"
            echo
            echo "容器实测:"
            echo "  Alpine 3.20 启动成功  PID 23319"
            echo "  容器内 pid=1 uid=0 hostname=testalpine"
            echo "  apk 包管理可用"
            echo "\`\`\`"
            echo
            echo "#### 仍未覆盖"
            echo
            echo "\`DEVTMPFS\` \`CFS_BANDWIDTH\` \`CGROUP_PIDS\` \`USER_NS\`"
            echo
            echo "（Droidspaces 标为 OPTIONAL/RECOMMENDED，不影响容器启动）"
            echo
            echo "#### 安装"
            echo
            echo "刷入 \`lkm4ctr-oppo-*.zip\` → 重启。日志 \`/data/local/tmp/lkm4ctr.log\`"
          } > notes.md
          # 产物实际落在 dist/out/ 下 (download-artifact 保留了 out/ 前缀),
          # 直接写 dist/*.ko 匹配不到任何文件, gh 会失败。
          # 用 find 收集所有 ko 和 zip, 避免路径假设。
          mapfile -t FILES < <(find dist -type f \( -name '*.ko' -o -name '*.zip' \) | sort)
          echo "将上传 ${#FILES[@]} 个文件:"
          printf '  %s\n' "${FILES[@]}"

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::没有可发布的产物"
            exit 1
          fi

          # 不再吞掉错误: 发布失败就是失败, 便于发现
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "lkm4ctr ${{ inputs.kmi }} $(date +%Y-%m-%d)" \
            --notes-file notes.md \
            "${FILES[@]}"
