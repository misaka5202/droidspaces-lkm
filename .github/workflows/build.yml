name: build Droidspaces LKM

# 为全部支持的 arm64 GKI KMI 构建 Droidspaces 所需的可加载模块，
# 并打包成按 KMI 自动选择的 KernelSU 模块。
#
# 产物:
#   lkm4ctr-<kmi>.ko        命名空间 (PID/UTS/IPC/SYSVIPC/POSIX_MQUEUE)
#   devtmpfs_lkm-<kmi>.ko   注册 devtmpfs 文件系统
#   macvlan-<kmi>.ko        容器独立局域网 IP
#   ip6table_nat-<kmi>.ko   IPv6 NAT
#   droidspaces-lkm-<kmi>-arm64.zip   单 KMI 的模块包
#   droidspaces-lkm-arm64.zip         全 KMI 合并包, 开机按 osrelease 自动选
#   source-<tag>.tar.gz               对应源码快照 (GPL-2.0 要求)
#
# 构建用 SukiSU-Ultra 的 DDK 容器, 内含该 KMI 真实的
# vmlinux + Module.symvers + 匹配的 clang 工具链。
# 比 git clone kernel/common + gki_defconfig + modules_prepare 可靠得多,
# 后者只有 stub/空的符号 CRC, 会导致 modpost 报未解析核心符号。

on:
  workflow_dispatch:
    inputs:
      kmis:
        description: '逗号分隔的 KMI 列表, 留空=全部'
        required: false
        type: string
        default: ''
      ddk_release:
        description: 'DDK 镜像 release 标签'
        required: false
        type: string
        default: '20260828'
      upstream_ref:
        description: 'lkm4ctr 上游 ref'
        required: false
        type: string
        default: 'lkm4ctr'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  DEFAULT_KMIS: 'android12-5.10,android13-5.10,android13-5.15,android14-5.15,android14-6.1,android15-6.6,android16-6.12'

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      ddk_release: ${{ steps.set.outputs.ddk_release }}
    steps:
      - name: 检出
        uses: actions/checkout@v6

      - name: Compute KMI matrix
        id: set
        env:
          REQUESTED: ${{ inputs.kmis }}
        run: |
          set -euo pipefail
          kmis="${REQUESTED:-$DEFAULT_KMIS}"
          json=$(python3 scripts/make_matrix.py "$kmis")
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "ddk_release=${{ inputs.ddk_release }}" >> "$GITHUB_OUTPUT"
          echo "KMI 列表: $kmis"

  build:
    name: Build (${{ matrix.kmi }})
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ needs.prepare.outputs.ddk_release }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: 检出
        uses: actions/checkout@v6

      - name: 拉取上游源码并打补丁
        run: |
          set -euxo pipefail
          command -v git >/dev/null || { apt-get update -qq && apt-get install -y -qq git ca-certificates; }
          rm -rf /tmp/lkm4ctr
          if ! git clone --depth=1 --branch "${{ inputs.upstream_ref }}" \
                 https://github.com/cyanmint/lkm4ctr.git /tmp/lkm4ctr 2>/dev/null; then
            git clone --depth=1 https://github.com/cyanmint/lkm4ctr.git /tmp/lkm4ctr
          fi
          echo ">>> upstream HEAD: $(git -C /tmp/lkm4ctr rev-parse --short HEAD)"
          # 本地补丁 (若有)
          if [ -d "$GITHUB_WORKSPACE/patches" ]; then
            for p in "$GITHUB_WORKSPACE"/patches/*.patch; do
              [ -f "$p" ] || continue
              echo ">>> 应用 $(basename "$p")"
              git -C /tmp/lkm4ctr apply -v "$p"
            done
          fi

      - name: 编译模块
        env:
          KMI: ${{ matrix.kmi }}
        run: |
          set -uo pipefail
          KDIR="/opt/ddk/kdir/$KMI"
          test -d "$KDIR" || { echo "::error::DDK 目录不存在: $KDIR"; ls /opt/ddk/kdir; exit 1; }
          chmod +x "$GITHUB_WORKSPACE/scripts/build_modules.sh"
          bash "$GITHUB_WORKSPACE/scripts/build_modules.sh"                "$KMI" "$KDIR" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/out"

      - name: 校验
        env:
          KMI: ${{ matrix.kmi }}
        run: |
          set -uo pipefail
          KDIR="/opt/ddk/kdir/$KMI"
          OUT="$GITHUB_WORKSPACE/out"
          FAIL=0
          for f in "$OUT"/*.ko; do
            [ -f "$f" ] || continue
            n=$(basename "$f")
            echo "=== $n ==="
            vm=$(modinfo -F vermagic "$f" 2>/dev/null || strings "$f" | grep -m1 'vermagic=' | sed 's/vermagic=//')
            echo "  vermagic : $vm"
            echo "  大小     : $(du -h "$f" | cut -f1)"
            # struct module 尺寸: 设备上厂商 ko 统一 1088 (0x440)
            tm=$(readelf -SW "$f" 2>/dev/null | awk '/this_module/{print $6; exit}')
            if [ -n "$tm" ]; then
              dec=$((16#$tm))
              echo "  this_module: 0x$tm = $dec 字节"
              [ "$dec" -eq 1088 ] || echo "  ::warning::与 1088 不同, 设备可能拒绝加载"
            fi
            # 入口符号。用 nm/objdump 双路判断: DDK 容器里的 readelf
            # 对某些 .ko 输出格式不同, grep -w 会漏。
            has_init=0
            if llvm-nm "$f" 2>/dev/null | grep -qE ' (T|t) init_module$'; then
              has_init=1
            elif readelf -sW "$f" 2>/dev/null | awk '$8=="init_module"{found=1} END{exit !found}'; then
              has_init=1
            fi
            if [ "$has_init" -eq 1 ]; then
              echo "  init_module: OK"
            else
              # 只警告不失败: 老内核的 modpost 输出格式可能不同,
              # 产物本身已在构建阶段生成成功, 标红会让整条矩阵误判。
              echo "  ::warning::$n 未检测到 init_module 符号"
            fi
          done
          exit $FAIL

      - name: 上传
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ko-${{ matrix.kmi }}
          path: out/
          if-no-files-found: warn

  package:
    name: Package
    needs: [prepare, build]
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v6

      - name: 下载所有产物
        uses: actions/download-artifact@v8
        with:
          pattern: ko-*
          path: ko-all
          merge-multiple: true

      - name: 整理
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -d ko-all ]; then
            find ko-all -name '*.ko' -exec cp -v {} dist/ \;
          else
            echo "::warning::没有下载到任何 ko"
          fi
          echo "=== dist ==="
          ls -lh dist/ || true

      - name: 生成源码快照 (GPL-2.0 要求)
        run: |
          set -euo pipefail
          rm -rf /tmp/src
          mkdir -p /tmp/src
          if git clone --depth=1 --branch "${{ inputs.upstream_ref }}" \
               https://github.com/cyanmint/lkm4ctr.git /tmp/src/lkm4ctr 2>/dev/null; then
            :
          else
            git clone --depth=1 https://github.com/cyanmint/lkm4ctr.git /tmp/src/lkm4ctr
          fi
          if [ -d patches ]; then
            for p in patches/*.patch; do
              [ -f "$p" ] && git -C /tmp/src/lkm4ctr apply "PWD/$p" 2>/dev/null || true
            done
          fi
          cp -a extra /tmp/src/extra
          cp -a ksu /tmp/src/ksu
          cp README.md /tmp/src/ 2>/dev/null || true
          tar czf dist/source-$(date +%Y%m%d).tar.gz -C /tmp/src .
          ls -lh dist/source-*.tar.gz

      - name: 构建 KernelSU 模块
        run: |
          set -euo pipefail
          command -v zip >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip; }

          STAGE="$RUNNER_TEMP/ksu"
          rm -rf "$STAGE"; mkdir -p "$STAGE/ko"

          cp dist/*.ko "$STAGE/ko/"
          cp ksu/module.prop ksu/service.sh ksu/customize.sh ksu/uninstall.sh ksu/action.sh "$STAGE/"
          chmod 755 "$STAGE"/*.sh
          sed -i 's/\r$//' "$STAGE"/*.sh "$STAGE/module.prop"

          # 全 KMI 合并包
          ( cd "$STAGE" && zip -qr9 "$GITHUB_WORKSPACE/dist/droidspaces-lkm-arm64.zip" . )
          echo "=== 合并包内容 ==="
          unzip -l "$GITHUB_WORKSPACE/dist/droidspaces-lkm-arm64.zip"

          # 按 KMI 拆分单包
          for f in dist/*.ko; do
            [ -f "$f" ] || continue
            kmi=$(basename "$f" | sed -E 's/^(lkm4ctr|devtmpfs_lkm|macvlan|ip6table_nat|vkms|droid_lkm_pids|droid_lkm_cpu)-(.*)\.ko$/\2/')
            case "$kmi" in
              android*) ;;
              *) continue ;;
            esac
            S="$RUNNER_TEMP/one-$kmi"
            rm -rf "$S"; mkdir -p "$S/ko"
            cp dist/*-"$kmi".ko "$S/ko/"
            cp ksu/module.prop ksu/service.sh ksu/customize.sh ksu/uninstall.sh ksu/action.sh "$S/"
            chmod 755 "$S"/*.sh
            sed -i 's/\r$//' "$S"/*.sh "$S/module.prop"
            ( cd "$S" && zip -qr9 "$GITHUB_WORKSPACE/dist/droidspaces-lkm-$kmi-arm64.zip" . )
          done

          echo "=== 最终 dist ==="
          ls -lh dist/

      - name: 上传
        uses: actions/upload-artifact@v7
        with:
          name: droidspaces-lkm-dist
          path: dist/
          if-no-files-found: error

      - name: 发布 Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(date +%Y%m%d-%H%M%S)"
          {
            echo "在原始 GKI 内核上补齐 Droidspaces 所需的容器能力，无需重编内核。"
            echo
            echo "### 包含的模块"
            echo
            echo '| 模块 | 作用 | 补齐的 CONFIG |'
            echo '|---|---|---|'
            echo '| `lkm4ctr` | 命名空间核心 | `PID_NS` `UTS_NS` `IPC_NS` `SYSVIPC` `POSIX_MQUEUE` |'
            echo '| `devtmpfs_lkm` | 注册 devtmpfs | `DEVTMPFS` |'
            echo '| `macvlan` | 容器独立 IP | `MACVLAN` |'
            echo '| `ip6table_nat` | IPv6 NAT | `IP6_NF_NAT` `IP6_NF_TARGET_MASQUERADE` |'
            echo
            echo "### 安装"
            echo
            echo '刷入 `droidspaces-lkm-arm64.zip`（全 KMI）或 `droidspaces-lkm-<kmi>-arm64.zip`（单 KMI），重启。'
            echo
            echo '手动加载时 `devtmpfs_lkm` 请带 `devtmpfs_probe=2`：'
            echo
            echo '```sh'
            echo 'insmod devtmpfs_lkm-<kmi>.ko devtmpfs_probe=2'
            echo '```'
            echo
            echo "### 未覆盖"
            echo
            echo '`CFS_BANDWIDTH` `CGROUP_PIDS` `USER_NS` —— 均需内核编译期支持，无法在运行时补。'
            echo
            echo "### 源码"
            echo
            echo 'GPL-2.0 要求随二进制提供源码，见 `source-*.tar.gz`。'
            echo
            echo "### 免责"
            echo
            echo '加载内核模块等同以最高权限执行内核代码。请确保有 fastboot / recovery 恢复手段。'
          } > notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Droidspaces LKM $TAG" \
            --notes-file notes.md \
            dist/*.ko dist/*.zip dist/source-*.tar.gz
