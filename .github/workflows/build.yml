name: build lkm4ctr for OPPO Find X7 (android14-6.1)

# 目标: 验证 lkm4ctr 能否在 OPPO MT6989 (Find X7) 上编出可用的 ko。
#
# 设备情况:
#   内核      6.1.157-android14-11-o-g2d576b643492  -> KMI android14-6.1
#   KPROBES   =y      <- lkm4ctr 的 kprobe 后端依赖它
#   FTRACE    =y
#   FUNCTION_TRACER =n <- lkm4ctr 文档说量产 GKI 常关, 会自动走 kprobe 后端
#   USER_NS   =n      <- 待验证能否被 vendor_kernel 补齐
#   PID_NS    =n
#   SYSVIPC   =n
#   DEVTMPFS  =n
#
# 构建用 SukiSU-Ultra 的 DDK 容器, 里面带该 KMI 真实的
# vmlinux + Module.symvers + 匹配的 clang 工具链。
# 比 git clone kernel/common + gki_defconfig + modules_prepare 可靠得多,
# 后者只有 stub/空的符号 CRC, 会导致 modpost 报未解析核心符号。

on:
  workflow_dispatch:
    inputs:
      kmi:
        description: 'KMI (默认 android14-6.1)'
        required: false
        type: string
        default: 'android14-6.1'
      ddk_release:
        description: 'DDK 镜像 release 标签'
        required: false
        type: string
        default: '20260828'
      upstream_ref:
        description: 'lkm4ctr 源码 ref (分支/tag/commit)'
        required: false
        type: string
        default: 'main'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build lkm4ctr.ko (${{ inputs.kmi }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
    timeout-minutes: 60

    steps:
      - name: 拉取 lkm4ctr 源码
        run: |
          set -euxo pipefail
          apt-get update -qq || true
          apt-get install -y -qq git ca-certificates || true
          git clone --depth=1 --branch "${{ inputs.upstream_ref }}" \
            https://github.com/cyanmint/lkm4ctr.git "$GITHUB_WORKSPACE/lkm4ctr" || {
              cd /tmp && rm -rf lkm4ctr
              git clone --depth=1 https://github.com/cyanmint/lkm4ctr.git lkm4ctr
              cp -a /tmp/lkm4ctr "$GITHUB_WORKSPACE/lkm4ctr"
            }
          cd "$GITHUB_WORKSPACE/lkm4ctr"
          echo ">>> HEAD: $(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          ls vendor/ glue/

      - name: 确认 DDK 环境
        run: |
          set -euxo pipefail
          KDIR="/opt/ddk/kdir/${{ inputs.kmi }}"
          test -d "$KDIR" || { echo "::error::DDK 目录不存在: $KDIR"; ls /opt/ddk/kdir 2>/dev/null || true; exit 1; }
          echo ">>> KDIR=$KDIR"
          ls "$KDIR" | head -20
          test -s "$KDIR/Module.symvers" && echo ">>> Module.symvers: $(wc -l < "$KDIR/Module.symvers") 条"
          test -f "$KDIR/vmlinux" && echo ">>> vmlinux 存在"

      - name: 编译 lkm4ctr.ko
        run: |
          set -euxo pipefail
          KDIR="/opt/ddk/kdir/${{ inputs.kmi }}"
          ROOT="$GITHUB_WORKSPACE/lkm4ctr/vendor"
          test -f "$ROOT/Makefile" || { echo "::error::vendor/Makefile 不存在"; ls "$ROOT"; exit 1; }
          make -C "$KDIR" M="$ROOT" LKM4CTR_LOG_DMESG=y modules -j"$(nproc)"
          mkdir -p "$GITHUB_WORKSPACE/out"
          find "$ROOT" -name '*.ko' -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: 校验 ko
        run: |
          set -euo pipefail
          KDIR="/opt/ddk/kdir/${{ inputs.kmi }}"
          FAIL=0
          DEV_ML=$(awk -F'\t' '$2=="module_layout"{print $1; exit}' "$KDIR/Module.symvers" 2>/dev/null || true)
          echo "DDK module_layout: ${DEV_ML:-?}"
          echo "设备 module_layout: 0xea759d7f (来自 device_symvers.txt 的实测值)"
          echo

          for f in "$GITHUB_WORKSPACE"/out/*.ko; do
            [ -f "$f" ] || continue
            echo "=== $(basename "$f") ==="
            VM=$(modinfo -F vermagic "$f" 2>/dev/null || strings "$f" | grep -m1 'vermagic=' | sed 's/vermagic=//')
            echo "  vermagic: $VM"
            echo "  大小: $(du -h "$f" | cut -f1)"

            # __versions 段
            VS=$(llvm-objdump -h "$f" 2>/dev/null | awk '/__versions/{print $3; exit}')
            if [ -n "$VS" ]; then
              echo "  __versions: $((16#$VS)) 字节"
            else
              echo "  ::warning::无 __versions 段"
            fi

            # 依赖符号
            echo "  未定义符号数: $(llvm-nm -u "$f" 2>/dev/null | wc -l)"
          done
          exit $FAIL

      - name: 产物摘要
        if: always()
        run: |
          echo "=== 产物 ==="
          ls -lh "$GITHUB_WORKSPACE/out" 2>/dev/null || echo "(无产物)"

      - name: 上传
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lkm4ctr-${{ inputs.kmi }}-arm64
          path: out/
          if-no-files-found: warn
